<script>
'use strict';
const questionsLevel1=[
 {topic:'Определения',question:'Что представляет собой запись 5x = 12?',choices:['Линейная функция','Линейное уравнение','Линейное неравенство'],correct:1,hints:['Сравни: у функции обычно есть зависимая переменная y, а у неравенства — знак сравнения.','Здесь стоит знак равенства и нужно найти значение x.'],explanation:'Это линейное уравнение. Равенство 5x = 12 содержит неизвестное x, которое нужно найти.'},
 {topic:'Линейная функция',question:'Найди значение y при x = 5, если y = 3x + 2.',answers:['17','y=17','у=17'],hints:['Подставь число 5 вместо x в формулу.','Сначала вычисли 3 · 5, затем прибавь 2.'],explanation:'y = 3 · 5 + 2 = 15 + 2 = 17.'},
 {topic:'Линейное уравнение',question:'Реши уравнение: x + 9 = 17.',answers:['8','x=8','х=8'],hints:['Нужно оставить неизвестное x в левой части.','Вычти 9 из обеих частей уравнения.'],explanation:'x = 17 − 9, поэтому x = 8.'},
 {topic:'Линейное неравенство',question:'Реши неравенство: x + 4 > 9.',answers:['x>5','х>5'],hints:['Вычти одинаковое число из обеих частей неравенства.','Вычти 4. Знак неравенства при этом не изменится.'],explanation:'x + 4 > 9 ⇔ x > 9 − 4 ⇔ x > 5.'}
];

// Original, short sound cues generated locally in the browser; no external audio files.
function makeSound(scene){
 if(!soundEnabled)return;
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const ctx=new C(),t=ctx.currentTime;
  if(ctx.state==='suspended')ctx.resume().catch(()=>{});
  const limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-14;limiter.knee.value=8;limiter.ratio.value=4;limiter.attack.value=.004;limiter.release.value=.2;
  const master=ctx.createGain();master.gain.value=.28;master.connect(limiter);limiter.connect(ctx.destination);
  let duration=1.4;
  function tone(f,start,len,vol=.18,type='sine',endFreq=null){
   const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t+start);
   if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+start+len);
   g.gain.setValueAtTime(.0001,t+start);
   g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+start+Math.min(.05,len*.18));
   g.gain.setValueAtTime(Math.max(.0002,vol*.8),t+start+Math.min(.12,len*.35));
   g.gain.exponentialRampToValueAtTime(.0001,t+start+len);
   o.connect(g);g.connect(master);o.start(t+start);o.stop(t+start+len+.02);
  }
  if(scene==='key'){
   tone(783.99,0,.22,.11,'sine');tone(1174.66,.10,.38,.09,'sine');duration=.8;
  }else if(scene==='classDoor'){
   // Cheerful musical sparkle at the opening of class 7Б (not recorded children's voices).
   [[523.25,0,.22],[659.25,.14,.24],[783.99,.28,.25],[1046.5,.43,.8]].forEach(([f,a,d])=>tone(f,a,d,.22,'triangle'));
   tone(523.25,.45,.7,.07,'sine');tone(783.99,.46,.7,.08,'sine');duration=1.6;
  }else if(scene==='portal'){
   // Deep rising energy wave, sparkling harmonics and a clear opening accent.
   tone(72,0,1.95,.32,'sawtooth',215);tone(110,.08,1.85,.18,'triangle',330);
   [330,440,554.37,659.25].forEach((f,i)=>tone(f,.65+i*.16,1.32-i*.12,.12,'sine'));
   tone(784,1.42,.65,.25,'triangle',1568);tone(1046.5,1.67,1.05,.25,'sine');
   tone(1568,1.76,.65,.16,'sine');duration=3;
  }else if(scene==='final'){
   // Original short victory cue, separate from the cartoon's soundtrack.
   [[392,0,.27],[523.25,.22,.27],[659.25,.44,.27],[783.99,.66,.34],[1046.5,.96,1.1]].forEach(([f,a,d])=>tone(f,a,d,.23,'triangle'));
   [261.63,392,523.25].forEach(f=>tone(f,1.04,1.05,.095,'sine'));
   tone(1568,1.45,.7,.08,'sine');duration=2.8;
  }
  setTimeout(()=>ctx.close().catch(()=>{}),Math.ceil((duration+.35)*1000));
 }catch(e){}
}

 }catch(e){}
}

function portalChime(){if(!soundEnabled)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),t=ctx.currentTime;[523.25,659.25,783.99].forEach((hz,i)=>{const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.value=hz;g.gain.setValueAtTime(0.0001,t+i*.16);g.gain.exponentialRampToValueAtTime(.07,t+i*.16+.025);g.gain.exponentialRampToValueAtTime(.0001,t+i*.16+.7);osc.connect(g);g.connect(ctx.destination);osc.start(t+i*.16);osc.stop(t+i*.16+.72);});setTimeout(()=>ctx.close(),1600);}catch(e){}}

questionsLevel1.forEach((_,i)=>document.getElementById('task'+i).addEventListener('click',()=>openTask(i)));
document.getElementById('door').addEventListener('click',door);
document.getElementById('restart').addEventListener('click',()=>{show('<h2 id="dialogTitle">Начать заново?</h2><p>Все ключи четырёх уровней и итоговый выбор будут сброшены, и задания снова станут доступны.</p><div class="controls"><button class="action primary" id="yes">Да, начать заново</button><button class="action" id="no">Отмена</button></div>');document.getElementById('yes').onclick=()=>{completedLevels.forEach(arr=>arr.fill(false));finalSolved=false;level=0;saveProgress();render();close();document.getElementById('viewport').scrollLeft=0;};document.getElementById('no').onclick=close;});

const soundToggle=document.getElementById('soundToggle');
function updateSoundToggle(){soundToggle.textContent=soundEnabled?'Звук: включён':'Звук: выключен';soundToggle.setAttribute('aria-pressed',String(soundEnabled));}
soundToggle.addEventListener('click',()=>{soundEnabled=!soundEnabled;try{localStorage.setItem('escape-future-sound',soundEnabled?'on':'off');}catch(e){}updateSoundToggle();});
updateSoundToggle();
const introScreen=document.getElementById('introScreen');
const hasPriorProgress=completedLevels.some(a=>a.some(Boolean))||finalSolved;
const introExtras=document.getElementById('introExtras');
const introConfirm=document.getElementById('introConfirm');
introExtras.hidden=!hasPriorProgress;
function resetAllProgress(){completedLevels.forEach(a=>a.fill(false));finalSolved=false;level=0;saveProgress();render();introScreen.hidden=true;document.getElementById('viewport').scrollLeft=0;}
function askRestart(){if(!hasPriorProgress){resetAllProgress();return;}
  introExtras.hidden=false;introConfirm.hidden=false;
  introConfirm.innerHTML='<div>Начать игру с нуля? Все собранные ключи будут сброшены.</div><button type="button" id="confirmIntroReset">Да, начать заново</button><button type="button" id="cancelIntroReset">Отмена</button>';
  document.getElementById('confirmIntroReset').onclick=resetAllProgress;
  document.getElementById('cancelIntroReset').onclick=()=>{introConfirm.hidden=true;};
}
document.getElementById('beginBtn').addEventListener('click',()=>{if(hasPriorProgress)askRestart();else introScreen.hidden=true;});
document.getElementById('resetIntroBtn').addEventListener('click',askRestart);
document.getElementById('resumeBtn').addEventListener('click',()=>{introScreen.hidden=true;});
render();
</script>
